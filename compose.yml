services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: festpass
      POSTGRES_DB: festpass
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - back-tier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: backend/
    environment:
      REGNO: "202401100200065"
      DB_HOST: db
      DB_USER: festpass
      DB_NAME: festpass
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - front-tier
      - back-tier
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:1.30-alpine
    ports:
      - "8065:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - front-tier
    depends_on:
      - backend

networks:
  front-tier:
  back-tier:

volumes:
  db-data: